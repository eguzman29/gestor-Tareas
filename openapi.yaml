openapi: 3.0.3
info:
  title: "Gestor personal de tareas"
  version: "1.0.0"
  description: "CRUD de tareas con SQLite. Todos los errores responden {\"error\", \"detalles\"}."
security:
  - bearerAuth: []
paths:
  "/login":
    post:
      security: []
      summary: "Iniciar sesión"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Credenciales"}
      responses:
        "200":
          description: "Token JWT generado"
        "401": {$ref: "#/components/responses/SinToken"}
  "/tasks":
    get:
      summary: "Listar tasks"
      responses:
        "200":
          description: "Lista"
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Task"}
        "401": {$ref: "#/components/responses/SinToken"}
    post:
      summary: "Crear"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskNuevo"}
      responses:
        "201":
          description: "Creado"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/JsonInvalido"}
        "401": {$ref: "#/components/responses/SinToken"}
        "409": {$ref: "#/components/responses/Conflicto"}
        "422": {$ref: "#/components/responses/DatosInvalidos"}
  "/tasks/{id}":
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: integer}
    get:
      summary: "Consultar uno"
      responses:
        "200":
          description: "Encontrado"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "401": {$ref: "#/components/responses/SinToken"}
        "404": {$ref: "#/components/responses/NoExiste"}
    put:
      summary: "Reemplazar completo (solo admin)"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskNuevo"}
      responses:
        "200":
          description: "Reemplazado"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/JsonInvalido"}
        "401": {$ref: "#/components/responses/SinToken"}
        "403": {$ref: "#/components/responses/SinPermiso"}
        "404": {$ref: "#/components/responses/NoExiste"}
        "409": {$ref: "#/components/responses/Conflicto"}
        "422": {$ref: "#/components/responses/DatosInvalidos"}
    patch:
      summary: "Cambiar solo los campos enviados"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TaskCambio"}
      responses:
        "200":
          description: "Actualizado"
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        "400": {$ref: "#/components/responses/JsonInvalido"}
        "401": {$ref: "#/components/responses/SinToken"}
        "404": {$ref: "#/components/responses/NoExiste"}
        "409": {$ref: "#/components/responses/Conflicto"}
        "422": {$ref: "#/components/responses/DatosInvalidos"}
    delete:
      summary: "Borrar"
      responses:
        "204":
          description: "Borrado"
        "401": {$ref: "#/components/responses/SinToken"}
        "404": {$ref: "#/components/responses/NoExiste"}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Credenciales:
      type: object
      required: ["usuario", "clave"]
      properties:
        usuario: {type: string}
        clave: {type: string, format: password}
    TaskNuevo:
      type: object
      required: ["titulo", "estado", "prioridad", "fecha_limite"]
      properties:
        "titulo":
          type: string
          minLength: 3
          maxLength: 100
          description: "obligatorio, de 3 a 100 caracteres"
        "estado":
          type: string
          enum: ["pendiente", "en_progreso", "terminada"]
          description: "solo pendiente, en_progreso o terminada"
        "prioridad":
          type: integer
          description: "entre 1 y 5"
        "fecha_limite":
          type: string
          format: date
          description: "formato AAAA-MM-DD y no puede ser anterior a hoy"
    TaskCambio:
      type: object
      properties:
        "titulo": {type: string, minLength: 3, maxLength: 100}
        "estado": {type: string, enum: ["pendiente", "en_progreso", "terminada"]}
        "prioridad": {type: integer, minimum: 1, maximum: 5}
        "fecha_limite": {type: string, format: date}
    Task:
      allOf:
        - $ref: "#/components/schemas/TaskNuevo"
        - type: object
          required: ["id"]
          properties:
            id: {type: integer}
    Error:
      type: object
      required: ["error", "detalles"]
      properties:
        error: {type: string}
        detalles:
          type: array
          items: {type: string}
  responses:
    JsonInvalido:
      description: "El cuerpo no es un JSON válido"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    DatosInvalidos:
      description: "Los datos no cumplen las reglas"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    NoExiste:
      description: "No existe ese Task"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    Conflicto:
      description: "Un POST /tasks con datos válidos choca con lo que ya hay si el mismo usuario ya tiene una tarea con el mismo título y la misma fecha límite."
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    SinToken:
      description: "Falta el token, es inválido o ya expiró"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
    SinPermiso:
      description: "El rol no tiene permiso"
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}
